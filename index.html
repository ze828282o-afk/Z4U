<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Ziyad 4 Upload | منصة رفع الملفات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="rain"></canvas>
<div class="scan-overlay"></div>

<div class="wrap">

  <header class="hero">
    <div class="radar">
      <div class="ring pulse"></div>
      <div class="ring pulse delay"></div>
      <div class="core">
        <div class="core-mark">Z4U</div>
      </div>
    </div>

    <div class="status"><span class="dot"></span> SYSTEM ONLINE</div>
    <div class="callsign">FILE TRANSFER NODE</div>
    <h1 class="title">Ziyad<span class="glow"> 4 </span>Upload</h1>
    <p class="tagline">ارفع ملفك، خُد اللينك، ابعته لمين ما تحب. بسيطة كده.</p>
  </header>

  <!-- ===== شاشة تسجيل الدخول ===== -->
  <section id="authScreen" class="auth-card">
    <button id="googleLoginBtn" class="google-btn">
      <svg viewBox="0 0 48 48" width="20" height="20">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35 26.9 36 24 36c-5.3 0-9.6-3.4-11.3-8.1l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.9 35.9 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
      </svg>
      <span>تسجيل الدخول بحساب جوجل</span>
    </button>
    <p class="auth-hint">لازم تسجّل دخول علشان ترفع وتدير ملفاتك</p>
  </section>

  <!-- ===== الداشبورد بعد الدخول ===== -->
  <section id="dashboardScreen" class="dashboard hidden">

    <div class="user-bar">
      <img id="userAvatar" class="avatar" src="" alt="">
      <div class="user-info">
        <div id="userName" class="user-name"></div>
        <div id="userEmail" class="user-email"></div>
      </div>
      <button id="logoutBtn" class="logout-btn" title="تسجيل الخروج">خروج</button>
    </div>

    <div id="dropzone" class="dropzone">
      <input type="file" id="fileInput" hidden>
      <div class="dropzone-inner">
        <div class="dz-icon">↑</div>
        <div class="dz-text">اسحب الملف هنا أو دوس للاختيار</div>
        <div class="dz-sub">أي نوع ملف، حد أقصى حسب خطة Firebase بتاعتك</div>
      </div>
    </div>

    <div id="uploadProgress" class="upload-progress hidden">
      <div class="progress-label">
        <span id="progressFileName">جاري الرفع...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="دور في ملفاتك...">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
    </div>

    <div id="fileList" class="file-list"></div>
    <p id="emptyState" class="empty-state hidden">لسه مافيش ملفات مرفوعة</p>
    <p id="noResults" class="no-results hidden">مفيش ملف بالاسم ده</p>

  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
